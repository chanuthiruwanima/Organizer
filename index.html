<!DOCTYPE html> 
<html>
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cozy Study</title>
    </head>

    <body>
        <div class="paper">
            <div class="countdown">
                <div class="countdown-container"></div>
                <span>26</span>
                <p>Days until Bio Test</p>
            </div>
            <div class="grid">
            <div class="subject"><h2>Biology</h2></div>
            </div>
            <div class="unit-title"><h3>Cell Division</h3></div>
            <div class="progress-bar"></div>
            <ul class="checklist">
                <li>
                    <label>
                        <input type="checkbox"> Mitosis
                    </label>
                    <span class="badge confident"></span>
                </li>
                    <li>
                    <label>
                        <input type="checkbox"> Meosis
                    </label>
                 <span class="badge review"></span>
                </li>
                    <li>
                    <label>
                        <input type="checkbox"> Chromosomes
                    </label>
                     <span class="badge learn"></span>
                </li>
            </ul>
        </div>
        <div id="utilities">
            <button class="utility" id="music-btn"><img src=""></button>
            <button class="utility" id=""><img src=""></button>
            <span class="utility" id="streak"></span>
        </div>
    </body>
</html>
